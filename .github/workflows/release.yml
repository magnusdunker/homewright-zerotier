# Bygger en binær pr. platform, når et tag som v1.2.3 pushes, og lægger dem
# sammen med thehome.json på en GitHub-release. TheHome installerer derfra.
#
# libzt (ZeroTier som bibliotek) er C og C++. Linux-binærerne bygges med en
# musl-krydskompiler med C++ i messense/rust-musl-cross, så de er statiske.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # navnet på binæren fra Cargo.toml og domænet fra thehome.json
  BIN: zerotier
  DOMAIN: zerotier

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, image: x86_64-musl }
          - { target: aarch64-unknown-linux-musl, image: aarch64-musl }
    runs-on: ubuntu-latest
    container: messense/rust-musl-cross:${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$DOMAIN-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/$BIN${{ matrix.ext }}" "dist/$DOMAIN-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A release published on github.com already exists; then only add the files.
      - run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* thehome.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* thehome.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
