[package]
name = "thehome-zerotier"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "ZeroTier til TheHome: TheHome som medlem af et ZeroTier-netværk, og netværk og medlemmer fra ZeroTier Central"
publish = false

[[bin]]
name = "zerotier"
path = "src/main.rs"

[dependencies]
thehome-plugin = { git = "https://github.com/magnusdunker/thehome-example-integration-rust", rev = "a8f05c1859f6689b2a31d2188593eb872408385e" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
